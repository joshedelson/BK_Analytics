<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:var(--bg,transparent);overflow:hidden}iframe{display:block;width:100%;border:0}
</style></head><body><iframe id="grid" title="MLB compact stats grid"></iframe><script>
const grid=document.getElementById('grid');
// Copy the app's own font into the table so it matches Streamlit's tables.
let appFont=null;
let frozen=false, integrated=false, currentDoc=null, allocated=585;
function setHeight(height){
 height=Math.ceil(height);
 grid.style.height=height+'px';
 streamlit('streamlit:setFrameHeight',{height});
}
function fitTable(){
 if(!integrated)return;
 try{
  const doc=grid.contentDocument, footer=doc.querySelector('.table-footer');
  if(footer){setHeight(Math.ceil(footer.getBoundingClientRect().bottom)+2);return;}
 }catch(e){}
 setHeight(allocated);
}
grid.addEventListener('load',fitTable);
function appFontStyle(){
 if(appFont!==null)return appFont;
 appFont='';
 try{
  const pd=window.parent.document,css=[];
  for(const sheet of pd.styleSheets){
   let rules;try{rules=sheet.cssRules}catch(e){continue}
   for(const r of rules){
    if(r.type===5)css.push(r.cssText.replace(/url\((['"]?)([^'")]+)\1\)/g,
     (m,q,u)=>/^(data:|https?:)/.test(u)?m:'url("'+new URL(u,sheet.href||pd.baseURI).href+'")'));
   }
  }
  const family=window.parent.getComputedStyle(pd.body).fontFamily;
  if(family)appFont='<style>'+css.join('\n')+' :root{--app-font:'+family+'}</style>';
 }catch(e){}
 return appFont;
}
function streamlit(type,payload){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},payload||{}),'*');}
window.addEventListener('message',e=>{
 if(e.source===window.parent && e.data && e.data.type==='streamlit:render'){
  const args=e.data.args||{};
  const bg=(args.html||'').match(/--bg:\s*([^;]+);/);
  if(bg)document.documentElement.style.setProperty('--bg',bg[1].trim());
  const doc=(args.html||'').replace('<head>','<head>'+appFontStyle());
  integrated=!!args.integrated_freeze;
  allocated=Number(args.height)||585;
  if(currentDoc!==doc){currentDoc=doc;setHeight(allocated);grid.srcdoc=doc;}
  else if(integrated)fitTable();
  if(!integrated){grid.style.height=(args.height||585)+'px';streamlit('streamlit:setFrameHeight',{height:args.height||585});}
 }
 if(e.source===grid.contentWindow && e.data && integrated){
  if(e.data.type==='nba-freeze-change')frozen=!!e.data.value;
  if(e.data.type==='nba-freeze-ready')grid.contentWindow.postMessage({type:'nba-freeze-state',value:frozen},'*');
  if(e.data.type==='nba-table-height'){const height=Math.ceil(Number(e.data.height));if(Number.isFinite(height)&&height>0&&height<1000)setHeight(height+2);}
 }
 if(e.source===grid.contentWindow && e.data && e.data.type==='mlb-player-click'){
  streamlit('streamlit:setComponentValue',{value:{player_id:e.data.player_id,year:e.data.year,
     kind:e.data.kind,nonce:e.data.nonce},dataType:'json'});
 }
});
streamlit('streamlit:componentReady',{apiVersion:1});
</script></body></html>
